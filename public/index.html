<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --text:#e6e9ef; --dim:#8b93a3; --accent:#5b9dff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,system-ui,sans-serif; min-height:100vh; }
  header { display:flex; gap:4px; padding:14px 20px 0; border-bottom:1px solid var(--line); }
  .tab { padding:10px 18px; color:var(--dim); cursor:pointer; border:1px solid transparent; border-bottom:none; border-radius:8px 8px 0 0; user-select:none; }
  .tab.active { background:var(--card); border-color:var(--line); color:var(--text); }
  main { padding:20px; max-width:1100px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  textarea { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:12px; font:inherit; resize:vertical; min-height:70px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 22px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  .row > * { flex:1; min-width:320px; }
  h3 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:10px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { padding:7px 10px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--dim); font-weight:600; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; font-size:12.5px; overflow-x:auto; color:#a5d6ff; }
  #err { color:#ff7b72; }
  #status { display:flex; align-items:center; padding:0 6px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  #wmode { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--dim); cursor:pointer; user-select:none; }
  #wmode input { appearance:none; width:34px; height:19px; border-radius:99px; background:var(--line); position:relative; cursor:pointer; transition:.15s; margin:0; }
  #wmode input::after { content:""; position:absolute; width:15px; height:15px; border-radius:50%; background:#8b93a3; top:2px; left:2px; transition:.15s; }
  #wmode input:checked { background:#4a1717; }
  #wmode input:checked::after { left:17px; background:#ff7b72; }
  #wmode.on span { color:#ff7b72; }
  #prog { list-style:none; padding:0; font-size:13px; color:var(--dim); }
  #prog li { padding:1px 0; }
  .btn2 { background:var(--line); color:var(--text); margin-left:8px; }
  .btnrun { background:#b62324; }
  .btnrow { margin-top:12px; }
  .hidden { display:none; }
  .chart { display:block; }
  .chart svg { width:100% !important; max-width:100% !important; height:auto !important; }
  .examples { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .ex { font-size:12.5px; color:var(--dim); border:1px solid var(--line); border-radius:99px; padding:4px 12px; cursor:pointer; }
  .ex:hover { color:var(--text); border-color:var(--accent); }
</style>
</head>
<body>
<header>
  <div class="tab active" data-tab="dash">Dashboard</div>
  <div class="tab" data-tab="er">ER</div>
  <label id="wmode" title="Let the agent prepare INSERT/UPDATE/DELETE/DDL statements. Every statement still requires your explicit confirmation before it runs.">
    <input type="checkbox" id="writeToggle"><span>write mode</span>
  </label>
  <div id="status" title="checking…"><span class="dot" style="background:#666"></span></div>
</header>
<main>
  <section id="dash">
    <div class="card">
      <textarea id="q" placeholder="Ask anything about your data… e.g. revenue by product category per customer country"></textarea>
      <div class="examples">
        <span class="ex">Revenue by product category per customer country</span>
        <span class="ex">Average salary per department</span>
        <span class="ex">Top 5 customers by total order value</span>
        <span class="ex">Orders per month</span>
      </div>
      <div style="margin-top:12px"><button id="go">Ask</button> <span id="err"></span></div>
    </div>
    <div id="out"></div>
  </section>
  <section id="er" class="hidden">
    <div class="card"><h3>Entity Relationships</h3><div id="erbox">Loading…</div></div>
  </section>
</main>
<script>
mermaid.initialize({ startOnLoad:false, theme:"dark", er:{ fontSize:12 } });

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  document.getElementById("dash").classList.toggle("hidden", t.dataset.tab !== "dash");
  document.getElementById("er").classList.toggle("hidden", t.dataset.tab !== "er");
  if (t.dataset.tab === "er") loadER();
});

document.querySelectorAll(".ex").forEach(e => e.onclick = () => { q.value = e.textContent; });

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function isNum(v) { return typeof v === "number" || (v !== null && v !== "" && !isNaN(v)); }
function cells(r, cols) { return Array.isArray(r) ? r : cols.map(c => r[c]); }

function fmtSql(sql) {
  // pretty-print for display only: newline before major clauses, joins indented.
  // ponytail: keyword scanner, literals not protected — cosmetic, never executed.
  return String(sql || "")
    .replace(/\s+/g, " ")
    .replace(/\b(FROM|WHERE|GROUP BY|HAVING|ORDER BY|LIMIT|OFFSET|UNION ALL|UNION|INTERSECT|EXCEPT|VALUES|RETURNING|SET)\b/gi, "\n$1")
    .replace(/\b((?:LEFT|RIGHT|FULL|INNER|CROSS(?: OUTER)?)\s+)?JOIN\b/gi, m => "\n  " + m.toUpperCase())
    .trim();
}

async function health() {
  const el = document.getElementById("status");
  const color = { up: "#3fb950", down: "#ff7b72", wait: "#666" };
  const set = (c, tip) => { el.innerHTML = `<span class="dot" style="background:${c}"></span>`; el.title = tip; };
  try {
    const r = await fetch("/api/health");
    const d = await r.json();
    if (d.opencode && d.db) set(color.up, "opencode + database: connected");
    else if (!d.opencode && !d.db) set(color.down, "opencode AND database down");
    else if (!d.opencode) set(color.down, "opencode down — run: opencode serve --port 4096");
    else set(color.down, "database down: " + d.detail.db);
  } catch { set(color.down, "dashboard server unreachable"); }
}
health();
setInterval(health, 15000);

// --- write mode toggle ---
const wt = document.getElementById("writeToggle"), wmode = document.getElementById("wmode");
wt.onchange = async () => {
  const want = wt.checked ? "write" : "read";
  const r = await fetch("/api/mode", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ mode: want }) });
  const d = await r.json();
  if (!r.ok) { wt.checked = !wt.checked; err.textContent = "Error: " + d.error; return; }
  wmode.classList.toggle("on", wt.checked);
};
fetch("/api/mode").then(r => r.json()).then(d => {
  wt.checked = d.mode === "write";
  wmode.classList.toggle("on", wt.checked);
});

function show(html) { document.getElementById("out").innerHTML = html; }

function progLine(p) {
  const li = document.createElement("li");
  if (p.stage) { li.textContent = "⚠ " + (p.stage === "retrying" ? "SQL failed — agent is fixing it with the database error…" : p.stage); }
  else {
    const name = (p.tool || "").replace(/^postgres_/, "").replace(/_/g, " ");
    li.textContent = (p.status === "completed" ? "✓ " : "→ ") + name + (p.status === "completed" ? "" : "…");
  }
  document.getElementById("prog")?.appendChild(li);
}

async function ask() {
  const btn = document.getElementById("go"), err = document.getElementById("err");
  const question = document.getElementById("q").value.trim();
  if (!question) return;
  btn.disabled = true; err.textContent = "";
  show(`<div class="card"><h3>Progress</h3><ul id="prog"><li>→ asking agent…</li></ul></div>`);
  try {
    const res = await fetch("/api/ask", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ question, stream: true }) });
    if (!res.ok || !res.body) { const d = await res.json().catch(() => ({})); throw new Error(d.error || res.statusText); }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!line) continue;
        const evt = JSON.parse(line);
        if (evt.progress) progLine(evt.progress);
        if (evt.error) throw new Error(evt.error);
        if (evt.result) {
          show(render(evt.result));
          if (evt.result.needsConfirmation) wireConfirm(evt.result); else await runCharts();
        }
      }
    }
  } catch (e) { err.textContent = "Error: " + e.message; show(""); }
  btn.disabled = false;
}

async function runCharts() {
  const pre = document.querySelector("#out pre.mermaid");
  if (!pre) return;
  try { await mermaid.run({ nodes: [pre] }); }
  catch (e) { pre.replaceWith(document.createTextNode("chart render failed: " + e.message)); }
}
document.getElementById("go").onclick = ask;
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask(); });

function chartSpec(d) {
  // make any agent/data input renderable: quotes->', strip control chars, coerce type, cap points, positive pie values
  const clean = s => String(s ?? "").replace(/"/g, "'").replace(/[\x00-\x1f]/g, " ").trim();
  const type = ["bar", "line", "pie"].includes(d.chart?.type) ? d.chart.type : "bar";
  const title = clean(d.chart?.title) || "Chart";
  const x = clean(d.chart?.x), y = clean(d.chart?.y);
  const cols = Array.isArray(d.columns) ? d.columns : [];
  const rows = Array.isArray(d.rows) ? d.rows.slice(0, 15) : [];
  const xi = cols.indexOf(x), yi = cols.indexOf(y);
  if (xi < 0 || yi < 0 || rows.length === 0) return null;
  const labels = rows.map(r => clean(cells(r, cols)[xi]).slice(0, 14)), vals = rows.map(r => Number(cells(r, cols)[yi]) || 0);
  if (type === "pie") {
    const pts = labels.map((l, i) => [l || "n/a", vals[i]]).filter(([, v]) => v > 0);
    if (pts.length === 0) return null;
    return `pie title ${title}\n` + pts.map(([l, v]) => `"${l}" : ${v}`).join("\n");
  }
  const ymax = Math.ceil(Math.max(...vals, 0) * 1.1) || 1;
  return `xychart-beta\ntitle "${title}"\nx-axis [${labels.map(l => `"${l}"`).join(", ")}]\ny-axis "${y}" 0 --> ${ymax}\n${type === "line" ? "line" : "bar"} [${vals.join(", ")}]`;
}

function render(d) {
  if (d.needsConfirmation) return confirmCard(d);
  const spec = d.chart ? chartSpec(d) : null;
  const h = `<div class="card"><div class="row">
    <div><h3>Answer</h3><p>${esc(d.summary)}</p></div>
    <div><h3>SQL</h3><pre>${esc(fmtSql(d.sql))}</pre></div>
  </div></div>` +
  (spec ? `<div class="card"><h3>Chart</h3><div class="chart" id="chart"><pre class="mermaid">${esc(spec)}</pre></div></div>` : "") +
  (d.rows.length
    ? `<div class="card"><h3>Result (${d.rows.length} rows)</h3><div style="overflow-x:auto"><table><tr>${d.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>` +
      d.rows.map(r => `<tr>${cells(r, d.columns).map(v => `<td class="${isNum(v) ? "num" : ""}">${esc(v)}</td>`).join("")}</tr>`).join("") + `</table></div></div>`
    : `<div class="card"><h3>Result</h3><p>${d.rowCount ?? 0} row(s) affected.</p></div>`);
  return h;
}

function confirmCard(d) {
  return `<div class="card" id="confirmcard">
    <h3>Confirmation required</h3>
    <p>${esc(d.summary)}</p>
    <pre>${esc(fmtSql(d.sql))}</pre>
    <div class="btnrow">
      <button class="btnrun" id="doit">Run statement</button>
      <button class="btn2" id="cancelit">Cancel</button>
    </div>
  </div>`;
}

function wireConfirm(d) {
  const card = document.getElementById("confirmcard");
  document.getElementById("cancelit").onclick = () => show("");
  document.getElementById("doit").onclick = async () => {
    const b = document.getElementById("doit");
    b.disabled = true; b.textContent = "Running…";
    const r = await fetch("/api/execute", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ sql: d.sql }) });
    const res = await r.json();
    if (!r.ok) {
      b.disabled = false; b.textContent = "Run statement";
      card.insertAdjacentHTML("beforeend", `<p id="err">Error: ${esc(res.error)}</p>`);
      return;
    }
    show(render({ ...d, needsConfirmation: false, ...res }));
    await runCharts();
  };
}

async function loadER() {
  const box = document.getElementById("erbox");
  if (box.dataset.done) return;
  try {
    const r = await fetch("/api/er");
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    box.innerHTML = `<pre class="mermaid">${esc(d.mermaid)}</pre>`;
    await mermaid.run({ nodes:[box.firstChild] });
    box.dataset.done = 1;
  } catch (e) { box.textContent = "Error: " + e.message; }
}
</script>
</body>
</html>
